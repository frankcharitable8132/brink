name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained single-file exe (win-x64)
        run: >
          dotnet publish Brink.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -o publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish\Brink.exe -DestinationPath Brink-Windows-x64.zip -Force

      - name: Checksums
        shell: pwsh
        run: |
          $h = (Get-FileHash Brink-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$h  Brink-Windows-x64.zip" | Out-File -Encoding ascii SHA256SUMS-Windows.txt
          Get-Content SHA256SUMS-Windows.txt

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: windows/Brink-Windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brink-Windows-x64
          path: |
            windows/Brink-Windows-x64.zip
            windows/SHA256SUMS-Windows.txt

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/Brink-Windows-x64.zip
            windows/SHA256SUMS-Windows.txt
