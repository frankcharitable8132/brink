name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26   # macOS 26 SDK needed for Liquid Glass (.glassEffect)
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Build (release)
        run: swift build -c release
      - name: Package app
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Sanity check bundle
        run: |
          test -x dist/Brink.app/Contents/MacOS/Brink
          plutil -lint dist/Brink.app/Contents/Info.plist
          codesign --verify --verbose dist/Brink.app
