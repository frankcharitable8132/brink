name: Feature request
description: A new provider, language, or behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution. "I use Gemini CLI and want its ring too."
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Brink is small on purpose — new options go in the context menu, not a settings window.
  - type: checkboxes
    id: pr
    attributes:
      label: Contribution
      options:
        - label: I'd like to implement this myself (see CONTRIBUTING.md)
